name: Survey the banner
on:
  schedule:
    - cron: "0 0 * * *"   # 07:00 Ho Chi Minh City
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["banner/**", ".github/workflows/banner.yml"]
permissions:
  contents: write
concurrency:
  group: banner
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
        working-directory: banner
      - name: Survey the last year and render
        run: bun banner/render.mjs --user "${{ github.repository_owner }}" --out dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
